<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════
   五重塔の庭 — Pagoda in the Garden of Falling Blossoms
   A procedural voxel scene. Everything below is generated into one lattice
   of unit cubes, deduplicated, face-shaded and drawn as a single InstancedMesh.
   ══════════════════════════════════════════════════════════════════════════ */

let THREE, OrbitControls, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
} catch (err) {
  document.getElementById('lstage').textContent = 'load failed';
  const f = document.getElementById('fatal');
  f.style.display = 'block';
  f.innerHTML = 'three.js could not be fetched from the CDN.<br />This file needs one internet connection the first time it runs.';
  throw err;
}

/* ─────────────────────────────  palette  ─────────────────────────────── */
const PAL = {
  grassA:0x6f9b4f, grassB:0x5c8942, grassC:0x83b05e, mossDark:0x3f6130,
  dirt:0x6d4c35, dirtDark:0x53382a, stone:0x8e959c, stoneDark:0x6b727a, stoneLight:0xb2b8bf,
  gravel:0xa9a294, sand:0xe6d6ac, sandDark:0xcfb98c, sandLine:0xf3e8c8,
  water:0x2c7ea6, waterDeep:0x1b5c7d, foam:0xe2f4fb,
  wood:0x8c3f2b, woodDark:0x5c2a1d, woodLight:0xb1613f, plaster:0xf0e4cc, plasterShade:0xd9c9ab,
  roof:0x2e3a56, roofLight:0x3d4c6e, roofEdge:0x1f2739,
  gold:0xefc063, goldBright:0xffe1a0,
  vermilion:0xc8382c, vermilionDark:0x9b2a22, inkBlack:0x24242c,
  sakuraDeep:0xf28fb0, sakura:0xffb6cd, sakuraLite:0xffd8e5, sakuraSnow:0xfff2f6,
  mapleA:0xe8622a, mapleB:0xc93a20, mapleC:0xf2a03a,
  pineA:0x31674a, pineB:0x24513a, pineLite:0x4a8358,
  willowA:0x8dbf5f, willowB:0xa9cf74,
  bambooA:0xa6c96f, bambooB:0x7fa552, bambooLite:0xcadfa0,
  lanternGlow:0xffdda4, windowGlow:0xffc878, fireGlow:0xffb45e,
  foxWhite:0xe6e9ee, foxRed:0xd4553f,
  lilyPad:0x4c8b53, lotus:0xffc2d6, koiOrange:0xf4772f, koiWhite:0xf6f1e6, koiBlack:0x2b2b33,
  waterPlant:0x4f8f5a, reed:0x8a9c4e, iris:0x8f7ad1,
  jizo:0x93a096, bronze:0x6f7d5a, snow:0xf7f9fc
};

/* ─────────────────────────────  math / rng  ──────────────────────────── */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const frac = x => x - Math.floor(x);
function smoothstep(e0,e1,x){ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function mix(a,b,t){ return a+(b-a)*t; }

function mulberry(seed){
  let a = seed>>>0;
  return function(){
    a = (a + 0x6D2B79F5)>>>0;
    let t = a;
    t = Math.imul(t ^ (t>>>15), 1 | t);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}
const rnd = mulberry(1337);
const rr = (a,b)=> a + rnd()*(b-a);
const ri = (a,b)=> Math.floor(a + rnd()*(b-a+1));
const pick = arr => arr[Math.floor(rnd()*arr.length)];

function hash3(x,y,z){
  let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(z|0, 1442695041);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h ^= h>>>16;
  return ((h>>>0) % 65536) / 65536;
}
function vnoise(x,z,off){
  const xi = Math.floor(x), zi = Math.floor(z), xf = x-xi, zf = z-zi;
  const r = (a,b)=> hash3(a+off*7919, b-off*104729, off+13);
  const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  return r(xi,zi)*(1-u)*(1-v) + r(xi+1,zi)*u*(1-v) + r(xi,zi+1)*(1-u)*v + r(xi+1,zi+1)*u*v;
}
function fbm(x,z,oct,off){
  let amp=1, f=1, sum=0, norm=0;
  for(let i=0;i<(oct||4);i++){ sum += amp*vnoise(x*f,z*f,(off||0)+i); norm += amp; amp*=0.5; f*=2; }
  return sum/norm;
}

/* ─────────────────────────────  colour helpers  ──────────────────────── */
function scaleC(c, f){
  let r = ((c>>16)&255)*f, g = ((c>>8)&255)*f, b = (c&255)*f;
  r = r>255?255:r|0; g = g>255?255:g|0; b = b>255?255:b|0;
  return (r<<16)|(g<<8)|b;
}
function blendC(c0, c1, t){
  const r = Math.round(mix((c0>>16)&255,(c1>>16)&255,t));
  const g = Math.round(mix((c0>>8)&255,(c1>>8)&255,t));
  const b = Math.round(mix(c0&255,c1&255,t));
  return (r<<16)|(g<<8)|b;
}

/* ─────────────────────────────  voxel store  ─────────────────────────── */
const VOX  = new Map();   // packed coord -> colour      (opaque lattice)
const GLOW = new Map();   // packed coord -> colour      (self-lit cubes)
const WATER = [];         // {x,y,z,c,pond} animated surface cubes

const KMASK = 1023;
const key  = (x,y,z)=> (x & KMASK) | ((y & KMASK)<<10) | ((z & KMASK)<<20);
const inY  = y => y > -200 && y < 1000;

function set(x,y,z,c,j){
  if(!inY(y)) return;
  const k = key(x,y,z);
  const amt = (j===undefined) ? 0.05 : j;
  VOX.set(k, amt ? scaleC(c, 1 + (hash3(x,y,z)-0.5)*amt*2) : c);
  GLOW.delete(k);
}
function setIfEmpty(x,y,z,c,j){ if(!VOX.has(key(x,y,z)) && !GLOW.has(key(x,y,z))) set(x,y,z,c,j); }
function lum(x,y,z,c,j){
  if(!inY(y)) return;
  const k = key(x,y,z);
  GLOW.set(k, scaleC(c, 1 + ((j===undefined?0.04:j) ? (hash3(x,y,z)-0.5)*2*j : 0)));
  VOX.delete(k);
}
function solidAt(x,y,z){ const k = key(x,y,z); return VOX.has(k) || GLOW.has(k); }
function columnTop(x,z){ for(let y=90;y>-40;y--) if(solidAt(x,y,z)) return y; return -40; }

/* primitive fills ------------------------------------------------------- */
function box(x0,y0,z0,x1,y1,z1,c,j){
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
      for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++) set(x,y,z,c,j);
}
function shell(x0,y0,z0,x1,y1,z1,c,j){
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
      for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++){
        const border = (x===x0||x===x1||y===y0||y===y1||z===z0||z===z1);
        if(border) set(x,y,z,c,j);
      }
}
function ellipsoid(cx,cy,cz,rx,ry,rz,c,opts){
  const o = opts||{};
  const airy = o.airy||0, seed = o.seed||0, squash = o.squash||0;
  const ex = Math.ceil(rx), ey = Math.ceil(ry), ez = Math.ceil(rz);
  for(let dx=-ex;dx<=ex;dx++) for(let dy=-ey;dy<=ey;dy++) for(let dz=-ez;dz<=ez;dz++){
    const n = (dx*dx)/(rx*rx) + (dy*dy)/(ry*ry) + (dz*dz)/(rz*rz);
    let r = n + (hash3(cx+dx,cy+dy+seed,cz+dz)-0.5)*(o.lumpy===undefined?0.32:o.lumpy);
    if(r > 1) continue;
    if(airy && rnd() < airy) continue;
    const col = o.palette ? o.palette[Math.floor(rnd()*o.palette.length)] : c;
    if(squash && dy < -ry*0.35 && rnd() < squash) continue;
    set(cx+dx, cy+dy, cz+dz, col, o.jitter===undefined?0.07:o.jitter);
  }
}
function cyl(cx,cz,y0,y1,r,c,opts){
  const o = opts||{}; const r2 = r*r;
  for(let dx=-Math.ceil(r);dx<=Math.ceil(r);dx++) for(let dz=-Math.ceil(r);dz<=Math.ceil(r);dz++){
    const d = dx*dx+dz*dz;
    if(d > r2 + (o.fuzzy?r*0.6:0)) continue;
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++) set(cx+dx,y,cz+dz,c,o.j);
  }
}
function line3(x0,y0,z0,x1,y1,z1,c,thick){
  const t = thick||1, dx=x1-x0, dy=y1-y0, dz=z1-z0;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz)) * (t>1?1.6:1)));
  for(let i=0;i<=steps;i++){
    const f = i/steps;
    const x = Math.round(lerp(x0,x1,f)), y = Math.round(lerp(y0,y1,f)), z = Math.round(lerp(z0,z1,f));
    if(t<=1) set(x,y,z,c);
    else box(x-(t>>1),y,z-(t>>1), x+(t>>1),y,z+(t>>1), c);
  }
}
/* square ring (perimeter of a hollow square) */
function ring(cx,cz,y,half,c,opts){
  const o = (typeof opts === 'number') ? { j:opts } : (opts||{});
  for(let dx=-half;dx<=half;dx++){
    set(cx+dx,y,cz-half,c,o.j); set(cx+dx,y,cz+half,c,o.j);
  }
  for(let dz=-half+1;dz<=half-1;dz++){
    set(cx-half,y,cz+dz,c,o.j); set(cx+half,y,cz+dz,c,o.j);
  }
  if(o.fill) box(cx-half,y,cz-half,cx+half,y,cz+half,c,o.j);
}

/* ─────────────────────────────  site plan  ───────────────────────────── */
const WORLD = 52;                       // terrain spans [-52, 51]
const WATER_Y = 7;
const SITE = {
  temple:{ x:0,  z:-8, r:17, y:12 },
  yard:  { x:0,  z:6,  r:11, y:12 },
  zen:   { x:-29,z:13, r:12, y:11 },
  tea:   { x:-18,z:-25,r:9,  y:11 },
  pond:  { x:26, z:16, rx:15.5, rz:11.5, depth:7.6 },
  torii: { x:0,  z:37 },
  grove: { x:-38,z:-2  }
};

/* foot paths (poly-line lists, [x,z]) */
const PATHS = [
  [[0,50],[0,43],[0,37],[0,30],[1,23],[2,16],[1,9],[0,5]],       // approach
  [[1,23],[8,21],[12,20]],                                        // to bridge (west abutment)
  [[29,20],[33,19],[36,13],[34,7],[30,4]],                        // pond east rim to cascade
  [[1,23],[-9,20],[-18,18],[-25,15]],                             // to zen garden
  [[-25,15],[-31,10],[-33,3]],                                    // through zen garden
  [[0,9],[-8,4],[-13,-4],[-16,-13],[-18,-19]],                    // to tea house
  [[-18,-19],[-24,-24],[-28,-30]],                                // tea house around
  [[-2,-3],[-9,-6],[-16,-6]],                                     // temple ring link
  [[-6,-16],[2,-18],[9,-15],[13,-11]]                             // garden loop
];
function segDist(px,pz,ax,az,bx,bz){
  const vx=bx-ax, vz=bz-az, wx=px-ax, wz=pz-az;
  const L = vx*vx+vz*vz;
  const t = L ? clamp((wx*vx+wz*vz)/L,0,1) : 0;
  const dx = px-(ax+vx*t), dz = pz-(az+vz*t);
  return Math.sqrt(dx*dx+dz*dz);
}
function pathDist(x,z){
  let best = 1e9;
  for(const p of PATHS) for(let i=0;i<p.length-1;i++)
    best = Math.min(best, segDist(x,z,p[i][0],p[i][1],p[i+1][0],p[i+1][1]));
  const ringR = Math.abs(Math.hypot(x-SITE.temple.x, z-SITE.temple.z) - 14.5);
  return Math.min(best, ringR);
}

/* ground height field --------------------------------------------------- */
function ground(x,z){
  let h = 9 + fbm(x*0.042+5.5, z*0.042-3.1, 4, 1)*9 - 4.5;
  h += fbm(x*0.11-2.2, z*0.11+8.8, 2, 5)*2.2 - 1.1;

  // enclosing hills toward the map edge, with a lower pass to the south
  const dEdge = Math.max(Math.abs(x)*0.98, Math.abs(z));
  const southFactor = z > 0 ? 1 - 0.55*smoothstep(20,48,x*0.02+0.5) : 1;
  h += smoothstep(31, 55, dEdge) * 17 * southFactor;
  // northern mountain wall
  h += smoothstep(34, 48, -z) * (13 + fbm(x*0.06, -z*0.05, 3, 9)*16);
  // eastern knoll that carries the cascade
  const kd = Math.hypot((x-35)/14, (z+1)/12);
  h += Math.max(0, 1-kd) * 9.5;

  // flatten: temple plateau + courtyard
  h = mix(h, SITE.temple.y, smoothstep(SITE.temple.r, SITE.temple.r*0.62, Math.hypot(x-SITE.temple.x, z-SITE.temple.z)));
  h = mix(h, SITE.yard.y,   smoothstep(SITE.yard.r,   SITE.yard.r*0.55,   Math.hypot(x-SITE.yard.x, z-SITE.yard.z)));
  h = mix(h, SITE.zen.y,     smoothstep(SITE.zen.r, SITE.zen.r*0.7, Math.hypot((x-SITE.zen.x)*1.15, z-SITE.zen.z)));
  h = mix(h, SITE.tea.y,     smoothstep(SITE.tea.r,  SITE.tea.r*0.6, Math.hypot(x-SITE.tea.x, z-SITE.tea.z)));

  // pond bowl
  const P = SITE.pond;
  const pd = ((x-P.x)*(x-P.x))/(P.rx*P.rx) + ((z-P.z)*(z-P.z))/(P.rz*P.rz);
  if(pd < 1.45) h -= P.depth * clamp(1.28 - pd, 0, 1);

  return Math.round(h);
}
function inPond(x,z,pad){
  const P = SITE.pond, p = pad||0;
  const dx = (x-P.x)/(P.rx-p), dz = (z-P.z)/(P.rz-p);
  return dx*dx+dz*dz < 1;
}
function isWaterColumn(x,z){ return ground(x,z) < WATER_Y && inPond(x,z,0.6); }

function erase(x0,y0,z0,x1,y1,z1){
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
      for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++){
        const k = key(x,y,z); VOX.delete(k); GLOW.delete(k);
      }
}

/* ─────────────────────────────  build registry  ──────────────────────── */
const BUILD = [];
const task = (name, fn) => BUILD.push({ name, fn });

/* ══════════════════════════════════════════════════════════════════════════
   TERRAIN
   ══════════════════════════════════════════════════════════════════════ */
task('raising the land', ()=>{
  for(let x=-WORLD; x<=WORLD-1; x++){
    for(let z=-WORLD; z<=WORLD-1; z++){
      const h = ground(x,z);
      const underWater = h < WATER_Y;
      const sandy = underWater || (h >= WATER_Y && h <= WATER_Y+1 && inPond(x,z,2.2));
      const rocky = h > 24 || fbm(x*0.09+40, z*0.09-13, 3, 17) > 0.70 && h > 17;
      // strata
      const floorY = Math.min(1, h-9);
      for(let y=h; y>=floorY; y--){
        const d = h - y;
        let c;
        if(sandy)          c = blendC(PAL.sand, PAL.sandDark, clamp(0.25 + d*0.1 + (hash3(x,y,z)-0.5)*0.35, 0, 1));
        else if(rocky)     c = d===0 ? PAL.stoneDark : blendC(PAL.stone, PAL.dirtDark, clamp(d*0.16,0,1));
        else if(d === 0)   c = PAL.grassA;
        else if(d <= 2)    c = PAL.dirt;
        else               c = PAL.dirtDark;
        set(x,y,z,c,0.07);
      }
      if(sandy || underWater) continue;
      // surface variety: grass tone, moss, gravel near paths
      const n = fbm(x*0.13-3.3, z*0.13+9.1, 3, 23);
      const pd = pathDist(x,z);
      let top = n > 0.66 ? PAL.grassC : (n < 0.35 ? PAL.grassB : PAL.grassA);
      const moss = fbm(x*0.07+55, z*0.07+31, 2, 31);
      if(moss > 0.74) top = PAL.mossDark;
      if(pd < 1.5) top = blendC(PAL.gravel, PAL.stoneLight, (hash3(x,h,z)-0.5)*0.6+0.2);
      set(x,h,z,top,0.09);
    }
  }
});

/* ══════════════════════════════════════════════════════════════════════
   SMALL STONEWORK
   ════════════════════════════════════════════════════════════════════ */
function boulder(cx,cy,cz,r,seedTint){
  const rx = r*rr(0.85,1.25), ry = r*rr(0.6,0.95), rz = r*rr(0.85,1.25);
  ellipsoid(cx,cy,cz,rx,ry,rz,PAL.stone,{ lumpy:0.55, jitter:0.11, seed:seedTint||ri(0,500) });
  // moss on the north flank
  for(let dx=-Math.ceil(rx);dx<=rx;dx++) for(let dz=-Math.ceil(rz);dz<=rz;dz++){
    if(hash3(cx+dx,cy+40,cz+dz) < 0.55) continue;
    for(let dy=Math.ceil(ry);dy>-ry;dy--) if(solidAt(cx+dx,cy+dy,cz+dz)){ set(cx+dx,cy+dy,cz+dz,PAL.mossDark,0.1); break; }
  }
}

/* stone lantern (tōrō) ------------------------------------------------- */
function stoneLantern(x,z,s,opts){
  const o = opts||{}; const g = (o.y===undefined? ground(x,z) : o.y);
  const S = s||1;
  const lit = o.lit !== false;
  const stone = PAL.stoneLight, dark = blendC(PAL.stone,PAL.mossDark,0.35);
  if(S >= 1){
    box(x-1,g,z-1,x+1,g,z+1, dark);
    box(x-1,g+1,z-1,x+1,g+1,z+1, stone);
    cyl(x,z,g+2,g+4,0.75, stone,{j:0.06});
    box(x-1,g+5,z-1,x+1,g+5,z+1, stone);
    // fire box
    for(let y=g+6;y<=g+7;y++){
      for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
        if(Math.abs(dx)+Math.abs(dz) === 0) continue;
        const face = (Math.abs(dx)===1) !== (Math.abs(dz)===1);
        if(face && lit && (dx===0||dz===0)) set(x+dx,y,z+dz, blendC(PAL.stone,PAL.inkBlack,0.5),0.02);
        else set(x+dx,y,z+dz, stone);
      }
    }
    if(lit){ lum(x-1,g+6,z,PAL.fireGlow); lum(x+1,g+6,z,PAL.fireGlow);
             lum(x,g+6,z-1,PAL.fireGlow); lum(x,g+6,z+1,PAL.fireGlow);
             lum(x,g+7,z,PAL.lanternGlow); }
    // roof + jewel
    ring(x,z,g+8,2, dark);
    ring(x,z,g+9,1, stone);
    set(x,g+10,z, lit ? PAL.gold : stone);
    if(lit) lum(x,g+10,z,PAL.goldBright,0.02);
  } else {
    // pedestal pebble lantern
    box(x-1,g,z-1,x+1,g,z, dark);
    box(x,g+1,z,x,g+2,z, stone);
    if(lit) lum(x,g+3,z,PAL.fireGlow,0.02); else set(x,g+3,z,stone);
  }
}

/* fox (inari) statue --------------------------------------------------- */
function foxStatue(x,z,facing){
  const g = ground(x,z);
  box(x-1,g,z-1,x+1,g,z+1, PAL.stoneLight);
  box(x-1,g+1,z-1,x+1,g+2,z+1, PAL.foxWhite);          // body
  box(x-1,g+3,z-1,x+1,g+4,z, PAL.foxWhite);            // head
  set(x+facing,g+3,z-1, PAL.foxWhite);
  set(x,g+5,z-1, PAL.inkBlack); set(x,g+5,z+1, PAL.inkBlack);   // ear hints
  set(x-1,g+5,z, PAL.inkBlack); set(x+1,g+5,z, PAL.inkBlack);
  set(x,g+3,z+2, PAL.foxWhite); set(x,g+4,z+2, PAL.foxWhite);   // snout
  box(x-1,g+2,z-1,x+1,g+2,z-1, PAL.foxRed);            // bib
  box(x-1,g+5,z-1,x+1,g+5,z-1, PAL.foxRed);
  // tail curling up the back
  set(x-1,g+3,z+2, PAL.foxWhite); set(x-1,g+4,z+2, PAL.foxWhite);
  set(x-1,g+5,z+2, PAL.snow);
}

/* stone water basin (tsukubai) ----------------------------------------- */
function basin(x,z){
  const g = ground(x,z);
  cyl(x,z,g,g+1,1.25,PAL.stone);
  box(x-1,g+2,z-1,x+1,g+2,z+1, PAL.stoneDark);
  set(x,g+3,z,PAL.water);
  set(x-1,g+3,z-1,PAL.stoneLight);
  // bamboo spout
  line3(x-3,g+4,z-3,x-1,g+3,z-1,PAL.bambooB,1);
  set(x-3,g+3,z-3,PAL.bambooA); set(x-3,g+4,z-3,PAL.bambooA);
  set(x-4,g+3,z-3,PAL.bambooB);
  // small lantern behind
  stoneLantern(x+2,z+2,0.4,{y:g});
}

/* ══════════════════════════════════════════════════════════════════════
   PATHS  — flagstones laid over the terrain
   ════════════════════════════════════════════════════════════════════ */
task('laying the stepping stones', ()=>{
  const done = new Set();
  const flag = (px,pz,w)=>{
    const g = ground(px,pz);
    if(g < WATER_Y) return;
    for(let dx=-w;dx<=w;dx++) for(let dz=-w;dz<=w;dz++){
      if(dx*dx+dz*dz > w*w+0.4) continue;
      const k = key(px+dx,g,pz+dz);
      if(done.has(k)) continue; done.add(k);
      const n = hash3(px+dx,777,pz+dz);
      set(px+dx,g,pz+dz, blendC(PAL.stoneLight,PAL.stone, n*0.8), 0.05);
      if(n > 0.86) set(px+dx,g,pz+dz, blendC(PAL.stone,PAL.mossDark,0.5),0.06);   // mossy stone
    }
  };
  for(const p of PATHS){
    for(let i=0;i<p.length-1;i++){
      const [ax,az]=p[i], [bx,bz]=p[i+1];
      const len = Math.hypot(bx-ax,bz-az);
      const steps = Math.max(1, Math.round(len/1.7));
      for(let s=0;s<=steps;s++){
        const f = s/steps;
        const jitter = (hash3(i*97+s, 3, 11)-0.5)*1.1;
        flag(Math.round(lerp(ax,bx,f)+jitter), Math.round(lerp(az,bz,f)-jitter), 1);
      }
    }
  }
});

/* ══════════════════════════════════════════════════════════════════════
   WATER — pond surface + rocky cascade crag
   ════════════════════════════════════════════════════════════════════ */
task('filling the pond', ()=>{
  for(let x=-WORLD;x<WORLD;x++) for(let z=-WORLD;z<WORLD;z++){
    if(!isWaterColumn(x,z)) continue;
    const gh = ground(x,z);
    const depth = clamp((WATER_Y-gh)/5, 0, 1);
    WATER.push({ x, y:WATER_Y, z, c: blendC(PAL.water,PAL.waterDeep, depth*0.85 + (hash3(x,3,z)-0.5)*0.25), pond:0 });
  }
  // pond rim stones + plants
  for(let a=0;a<Math.PI*2;a+=0.011){
    const x = Math.round(SITE.pond.x + Math.cos(a)*SITE.pond.rx*0.78);
    const z = Math.round(SITE.pond.z + Math.sin(a)*SITE.pond.rz*0.78);
    const g = ground(x,z);
    if(g >= WATER_Y && hash3(x,5,z) > 0.72) set(x,g+1,z, blendC(PAL.stone,PAL.stoneDark, hash3(x,9,z)),0.08);
  }
  for(let i=0;i<150;i++){
    const a = rnd()*Math.PI*2, rr2 = Math.sqrt(rnd());
    const x = Math.round(SITE.pond.x + Math.cos(a)*SITE.pond.rx*0.7*rr2);
    const z = Math.round(SITE.pond.z + Math.sin(a)*SITE.pond.rz*0.7*rr2);
    if(!isWaterColumn(x,z)) continue;
    if(rnd() < 0.16){ // lotus
      set(x,WATER_Y,z,PAL.lilyPad,0.06);
      set(x,WATER_Y+1,z, rnd()<0.5?PAL.lotus:PAL.sakuraSnow,0.03);
    } else set(x,WATER_Y,z,PAL.lilyPad,0.08);
  }
  // reeds around the shore
  for(let i=0;i<230;i++){
    const a = rnd()*Math.PI*2;
    const x = Math.round(SITE.pond.x + Math.cos(a)*SITE.pond.rx*rr(0.66,0.86));
    const z = Math.round(SITE.pond.z + Math.sin(a)*SITE.pond.rz*rr(0.66,0.86));
    const g = ground(x,z);
    if(g < WATER_Y-1 || g > WATER_Y+2) continue;
    const h = ri(1,4);
    for(let y=1;y<=h;y++) set(x,g+y,z, y===h?PAL.reed:PAL.waterPlant, 0.1);
    if(rnd()<0.2) set(x,g+h+1,z,PAL.iris,0.04);
  }
});

const CASCADE = { x:30, z:4, top:19, lip:18 };
function buildCrag(){
  // rocky crag north-east of the pond with a spring basin on top
  const cx = 33, cz = 0;
  for(let x=cx-10;x<=cx+9;x++) for(let z=cz-9;z<=cz+8;z++){
    const d = Math.hypot((x-cx)/9.5, (z-cz)/8.5);
    if(d > 1.15) continue;
    const gh = ground(x,z);
    let top = Math.round(CASCADE.top - d*d*9 + (fbm(x*0.3,cz*0.3+z*0.3,2,71)-0.5)*3.4);
    top = Math.max(top, gh);
    for(let y=gh;y<=top;y++){
      const t = (y-gh)/Math.max(1,(top-gh));
      set(x,y,z, blendC(PAL.dirtDark, y>top-2?PAL.stoneDark:PAL.stone, clamp(t*1.7,0,1)), 0.11);
    }
  }
  // carve the spring pool on the summit
  for(let x=cx-4;x<=cx+1;x++) for(let z=cz-3;z<=cz+3;z++){
    const d = Math.hypot((x-cx+1.5)/3.6,(z-cz)/3.1);
    if(d > 1) continue;
    const top = CASCADE.lip;
    erase(x,top-2,z,x,top+2,z);
    WATER.push({ x, y:CASCADE.top, z, c: blendC(PAL.water,PAL.foam,0.18), pond:1 });
  }
  // spillway lip
  for(let x=cx-3;x<=cx;x++) { set(x,CASCADE.lip,cz+3,PAL.stoneDark,0.08); set(x,CASCADE.lip-1,cz+3,PAL.stone,0.08); }
  // moss + ferns on the crag
  for(let i=0;i<130;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*1.05;
    const x = Math.round(cx+Math.cos(a)*9.5*d), z = Math.round(cz+Math.sin(a)*8.5*d);
    const t = columnTop(x,z);
    if(t < 8 || solidAt(x,t+1,z)) continue;
    set(x,t+1,z, rnd()<0.5?PAL.mossDark:PAL.waterPlant, 0.12);
  }
  boulder(cx-9, ground(cx-9,cz+7)+1, cz+7, 2.2);
  boulder(cx+8, ground(cx+8,cz+5)+1, cz+5, 2.6);
}

/* ══════════════════════════════════════════════════════════════════════
   VERMILION TORII
   ════════════════════════════════════════════════════════════════════ */
function toriiGate(cx,cz,halfSpan,tall){
  const g = Math.min(ground(cx-halfSpan,cz), ground(cx+halfSpan,cz));
  const top = g + (tall?12:9);
  for(const s of [-1,1]){
    const px = cx + s*halfSpan;
    // stone base collar + tapered pillar
    box(px-1,g, cz-1, px+1, g, cz+1, PAL.stoneLight, 0.05);
    for(let y=g+1;y<=top-1;y++){
      box(px,y,cz-1,px,y,cz+1,PAL.vermilion,0.05);
      if((y-g) <= (top-g)*0.5){ set(px-1,y,cz,PAL.vermilion,0.05); set(px+1,y,cz,PAL.vermilion,0.05); }
    }
    box(px, top-1, cz-1, px, top-1, cz+1, PAL.vermilion);
    // black cap on pillar
    set(px,top,cz,PAL.inkBlack);
  }
  // nuki (tie beam) + gakuzuka
  box(cx-halfSpan-1, top-5, cz, cx+halfSpan+1, top-5, cz, PAL.vermilionDark,0.04);
  box(cx-halfSpan-1, top-4, cz, cx+halfSpan+1, top-4, cz, PAL.vermilion,0.04);
  box(cx, top-3, cz, cx, top-2, cz, PAL.vermilion);
  // kasagi: double curved lintel
  for(let dx=-halfSpan-3;dx<=halfSpan+3;dx++){
    const lift = Math.round(Math.pow(Math.abs(dx)/(halfSpan+3), 2.4) * 2.2);
    set(cx+dx, top+lift, cz,   PAL.vermilion, 0.04);
    set(cx+dx, top+lift, cz+1, PAL.vermilionDark, 0.04);
    set(cx+dx, top+lift-1, cz, blendC(PAL.vermilion,PAL.plaster,0.12), 0.04);
    set(cx+dx, top+lift, cz-1, PAL.inkBlack, 0.03);
    // ends flare out
    if(Math.abs(dx) > halfSpan+1) set(cx+dx, top+lift, cz-2, PAL.inkBlack, 0.03);
  }
  // hanging lanterns from the nuki
  for(const s of [-1,1]){
    const lx = cx + s*3;
    set(lx, top-6, cz, PAL.inkBlack);
    lum(lx, top-7, cz, PAL.lanternGlow, 0.02);
    set(lx, top-8, cz, PAL.vermilionDark);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ARCHED BRIDGE
   ════════════════════════════════════════════════════════════════════ */
task('arching the bridge', ()=>{
  const z0 = 20, xA = 12, xB = 29, apex = 5;
  const deckY = t => Math.round(ground(xA,z0) + apex*Math.sin(Math.PI*t));
  for(let x=xA; x<=xB; x++){

    const y = deckY(t);
    for(let dz=-1;dz<=1;dz++) set(x,y,z0+dz, (dz===0)?PAL.vermilion:PAL.vermilionDark, 0.05);
    set(x,y-1,z0-1,PAL.woodDark); set(x,y-1,z0+1,PAL.woodDark);
    // railings
    if((x-xA)%2 === 0){
      set(x,y+1,z0-1,PAL.vermilion); set(x,y+1,z0+1,PAL.vermilion);
      set(x,y+2,z0-1,PAL.vermilionDark); set(x,y+2,z0+1,PAL.vermilionDark);
    } else {
      set(x,y+2,z0-1,PAL.vermilion,0.04); set(x,y+2,z0+1,PAL.vermilion,0.04);
    }

      box(x-1,gh,z0-1,x+1,y,z0+1,PAL.stoneDark,0.07);

  }
  stoneLantern(xA-3, z0-4, 1);
  stoneLantern(xB+3, z0+4, 1);
});

      let dmin = 99;

function eaveTips(cx,cz,y,half,big){
  for(const sx of [-1,1]) for(const sz of [-1,1]){

      set(cx+sx*(half+1), y+2, cz+sz*(half+2), PAL.roofLight, 0.03);
      set(cx+sx*(half+2), y+3, cz+sz*(half+2), PAL.gold, 0.02);

}
function roof(cx,cz,yBase,half,levels,opts){

        set(cx+dx,yBase,cz-half,PAL.roofEdge,0.03); set(cx+dx,yBase,cz+half,PAL.roofEdge,0.03);
      }
      for(let dz=-half;dz<=half;dz+=2){
        set(cx-half,yBase,cz+dz,PAL.roofEdge,0.03); set(cx+half,yBase,cz+dz,PAL.roofEdge,0.03);

  }
  for(let dx=-half+1;dx<=half-1;dx+=2){
    set(cx+dx,yBase-1,cz-half+1,PAL.woodDark,0.04); set(cx+dx,yBase-1,cz+half-1,PAL.woodDark,0.04);

}
function pagodaBody(cx,cz,y0,half,bodyH,tierIdx){

  shell(cx-half,y0,cz-half, cx+half,y1,cz+half, PAL.plaster, 0.05);
  box(cx-half+1,y0,cz-half+1, cx+half-1,y1,cz+half-1, PAL.woodDark, 0.07);
  for(const sx of [-1,1]) for(const sz of [-1,1])

  for(const dy of [0, Math.round(bodyH/2), bodyH-1]) ring(cx,cz,y0+dy,half,PAL.wood,{j:0.04});
  for(let a=-half+2;a<=half-2;a+=3){
    for(const sz of [-1,1]) for(let y=y0;y<=y1;y++) set(cx+a,y,cz+sz*half,PAL.wood,0.04);

/* ═══════════════════════  VEGETATION  ═══════════════════════════════ */
const BLOOM_SOURCE = [];
function plantTop(x,z){
  const g = ground(x,z);
  if(g < WATER_Y) return null;
  if(columnTop(x,z) > g+1) return null;
  if(pathDist(x,z) < 1.9) return null;
  return g;
}

function blossomBlob(cx,cy,cz,rx,ry,rz,palette,airy){
  ellipsoid(cx,cy,cz,rx,ry,rz,0,{ airy:airy, lumpy:0.44, jitter:0.07, palette });
  BLOOM_SOURCE.push({ x:cx, y:cy, z:cz, r:Math.max(rx,rz) });
}

function cherryTree(x,z,S,seedShift){
  const g = plantTop(x,z);
  if(g === null) return false;
  S = S || 1;
  const trunkH = Math.round(rr(5,7)*S);
  const trunkC = blendC(0x4a3227, 0x6b4632, rnd()*0.6);
  let bx = x, bz = z;
  for(let i=0;i<=trunkH;i++){
    const t = i/trunkH;
    const th = Math.max(1, Math.round((2.4 - t*1.4)*S));
    bx = x + Math.round(Math.sin(t*2.1 + seedShift)*1.6*S);
    bz = z + Math.round(Math.cos(t*1.7 + seedShift)*1.2*S);
    box(bx-th, g+i, bz-th, bx+th, g+i, bz+th, trunkC, 0.09);
  }
  const nB = ri(5,8);
  const canopyY = g + trunkH + ri(1,3);
  for(let b=0;b<nB;b++){
    const a = (b/nB)*Math.PI*2 + rr(-0.4,0.4);
    const reach = rr(3.2,6.2)*S;
    const sx = bx, sy = g + trunkH - ri(0,2), sz = bz;
    const mx = Math.round(lerp(sx,sx+Math.cos(a)*reach,0.55));
    const mz = Math.round(lerp(sz,sz+Math.sin(a)*reach,0.55));
    const my = sy + ri(1,2);
    line3(sx,sy,sz,mx,my,mz,trunkC,1);
    const ex = Math.round(sx + Math.cos(a)*reach), ez = Math.round(sz + Math.sin(a)*reach);
    const ey = my + Math.round(rr(0.5,2.2));
    line3(mx,my,mz,ex,ey,ez,trunkC,1);
    const rx = rr(2.1,3.4)*S, ry = rr(1.5,2.3)*S, rz = rr(2.1,3.4)*S;
    blossomBlob(ex, ey+Math.round(ry*0.6), ez, rx, ry, rz,
      [PAL.sakuraDeep,PAL.sakura,PAL.sakuraLite,PAL.sakuraSnow,PAL.sakura,PAL.sakuraLite], 0.3);
  }
  const crx = rr(3.6,5.0)*S;
  blossomBlob(bx, canopyY+2, bz, crx, rr(2.4,3.2)*S, crx,
    [PAL.sakuraDeep,PAL.sakura,PAL.sakuraLite,PAL.sakuraSnow,PAL.sakura], 0.28);
  return true;
}

function mapleTree(x,z,S){
  const g = plantTop(x,z); if(g === null) return false;
  S = S||1;
  const h = Math.round(rr(5,8)*S);
  for(let i=0;i<=h;i++){ const t = Math.max(1, Math.round((1.6-(i/h)*1.2)*S)); box(x-t,g+i,z-t,x+t,g+i,z+t,0x54382a,0.08); }
  const cy = g+h+Math.round(rr(1,2.5)*S);
  for(let i=0;i<4;i++){
    const a = rr(0,Math.PI*2), d = rr(1.4,3.2)*S;
    ellipsoid(Math.round(x+Math.cos(a)*d), cy+ri(-1,1), Math.round(z+Math.sin(a)*d),
      rr(2,3.2)*S, rr(1.4,2.2)*S, rr(2,3.2)*S, 0,
      { airy:0.26, lumpy:0.5, jitter:0.09, palette:[PAL.mapleA,PAL.mapleB,PAL.mapleC,0xf6c76b] });
  }
  return true;
}

function pineTree(x,z,S){
  const g = plantTop(x,z); if(g === null) return false;
  S = S||1;
  const h = Math.round(rr(7,12)*S);
  for(let i=0;i<=h;i++){
    const t = Math.max(1, Math.round((1.5-(i/h))*S));
    box(x-t,g+i,z-t,x+t,g+i,z+t, 0x4b3626, 0.08);
  }
  const layers = ri(3,5);
  for(let l=0;l<layers;l++){
    const t = l/((layers-1)||1);
    const yy = g + Math.round(h*(0.36 + t*0.62));
    const r = Math.max(1, Math.round((3.6 - t*2.6)*S));
    ellipsoid(x, yy, z, r, Math.max(1,Math.round(r*0.42)), r, 0,
      { airy:0.12, lumpy:0.34, jitter:0.07, palette:[PAL.pineA,PAL.pineB,PAL.pineLite] });
  }
  return true;
}

function willowTree(x,z){
  const gg = ground(x,z);
  if(gg < WATER_Y-1 || gg > WATER_Y+3 || columnTop(x,z) > gg+1) return false;
  const g = gg;
  for(let i=0;i<8;i++){ const t = Math.max(1, Math.round(1.7 - i*0.16)); box(x-t,g+i,z-t,x+t,g+i,z+t,0x5a412c,0.08); }
  ellipsoid(x,g+9,z, 3.4,2.1,3.4, 0, { airy:0.2, lumpy:0.4, jitter:0.07, palette:[PAL.willowA,PAL.willowB] });
  for(let i=0;i<28;i++){
    const a = rr(0,Math.PI*2), d = rr(1.6,3.6);
    const sx = Math.round(x+Math.cos(a)*d), sz = Math.round(z+Math.sin(a)*d);
    const len = ri(4,11);
    for(let k=0;k<len;k++)
      set(sx + Math.round(Math.sin(k*0.6+a)*0.9), g+9-k, sz + Math.round(Math.cos(k*0.5+a)*0.9),
          k>len-3 ? PAL.willowB : PAL.willowA, 0.09);
  }
  return true;
}

function bambooCulm(x,z){
  const g = ground(x,z); if(g < WATER_Y || columnTop(x,z) > g+1) return;
  const h = ri(7,14);
  for(let i=0;i<h;i++)
    set(x,g+i,z, (i%3===0) ? PAL.bambooB : (hash3(x,i,z)>0.6 ? PAL.bambooLite : PAL.bambooA), 0.06);
  for(let i=0;i<ri(3,6);i++){
    const a = rr(0,Math.PI*2), d = rr(1,2.4);
    const lx = Math.round(x+Math.cos(a)*d), lz = Math.round(z+Math.sin(a)*d);
    set(lx, g+h-ri(0,3), lz, PAL.bambooLite, 0.1);
  }
}

function hedgeRun(x0,z0,x1,z1,h,col){
  const steps = Math.ceil(Math.hypot(x1-x0,z1-z0));
  for(let i=0;i<=steps;i++){
    const x = Math.round(lerp(x0,x1,i/steps)), z = Math.round(lerp(z0,z1,i/steps));
    const g = ground(x,z); if(g < WATER_Y) continue;
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      const top = h - (Math.abs(dx)+Math.abs(dz))*0.5;
      for(let y=0;y<=Math.round(top);y++)
        set(x+dx,g+y,z+dz, y>=top-0.5 ? scaleC(col,1.18) : col, 0.14);
    }
  }
}
function topiaryBall(x,z,r){
  const g = plantTop(x,z); if(g===null) return;
  ellipsoid(x,g+Math.max(1,Math.round(r)),z,r,r*0.9,r,0,{lumpy:0.26,jitter:0.1,palette:[0x3f6b3a,0x4d7f42,0x5f9450]});
}
function topiaryCone(x,z,r,h){
  const g = plantTop(x,z); if(g===null) return;
  for(let y=0;y<h;y++){
    const q = Math.max(0.6, r*(1 - y/h));
    for(let dx=-Math.ceil(q);dx<=q;dx++) for(let dz=-Math.ceil(q);dz<=q;dz++){
      if(dx*dx+dz*dz > q*q+0.3) continue;
      set(x+dx,g+y,z+dz, (dx*dx+dz*dz > (q-0.7)*(q-0.7))?0x568a48:0x3b6335, 0.12);
    }
  }
}

function cragTop(x,z){
  const cx = 33, cz = 0;
  const d = Math.hypot((x-cx)/9.5, (z-cz)/8.5);
  if(d > 1.15) return -999;
  return Math.round(CASCADE.top - d*d*9 + (fbm(x*0.3, cz*0.3+z*0.3, 2, 71)-0.5)*3.4);
}
function carveStream(){
  const pts = [[32,3],[31,5],[30,8],[29,11],[28,14],[27,16]];
  for(let i=0;i<pts.length-1;i++){
    const steps = Math.ceil(Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]));
    for(let s=0;s<=steps;s++){
      const x = Math.round(lerp(pts[i][0],pts[i+1][0],s/steps));
      const z = Math.round(lerp(pts[i][1],pts[i+1][1],s/steps));
      for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
        const px2 = x+dx, pz2 = z+dz;
        const top = columnTop(px2,pz2);
        if(top > WATER_Y-2) erase(px2, WATER_Y-2, pz2, px2, top, pz2);
        set(px2, WATER_Y-2, pz2, PAL.stoneDark, 0.07);
        WATER.push({ x:px2, y:WATER_Y, z:px2*0+pz2, c: blendC(PAL.water,PAL.foam,0.12), pond:0 });
      }
    }
  }
  for(let i=0;i<70;i++){
    const t = rnd()*(pts.length-1);
    const idx = Math.min(pts.length-2, Math.floor(t)), f2 = t - idx;
    const x = Math.round(lerp(pts[idx][0],pts[idx+1][0],f2) + rr(-3,3));
    const z = Math.round(lerp(pts[idx][1],pts[idx+1][1],f2) + rr(-3,3));
    const top = columnTop(x,z);
    if(top < WATER_Y-1 || solidAt(x,top+1,z)) continue;
    set(x,top+1,z, hash3(x,21,z)>0.5 ? PAL.mossDark : PAL.waterPlant, 0.12);
  }
}

const boxGeo = new THREE.BoxGeometry(1,1,1);

let lattice = null, glowMesh = null, waterMesh = null, waterCount = 0;
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(),
      _s = new THREE.Vector3(), _col = new THREE.Color(), _e = new THREE.Euler();

function decodeKey(k){
  const xb = k & 1023, yb = (k>>10) & 1023, zb = (k>>20) & 1023;
  return [ xb>=512 ? xb-1024 : xb, yb>=512 ? yb-1024 : yb, zb>=512 ? zb-1024 : zb ];
}
function uniqueWater(){
  const seen = new Map();
  for(const w of WATER){ const k = key(w.x,w.y,w.z); if(!seen.has(k)) seen.set(k,w); }
  return [...seen.values()];
}

function assemble(){
  const px = [], cl = [];
  for(const [k,c] of VOX){
    const xyz = decodeKey(k), x = xyz[0], y = xyz[1], z = xyz[2];
    const up = solidAt(x,y+1,z), dn = solidAt(x,y-1,z);
    const xp = solidAt(x+1,y,z), xm = solidAt(x-1,y,z);
    const zp = solidAt(x,y,z+1), zm = solidAt(x,y,z-1);
    if(up && dn && xp && xm && zp && zm) continue;
    let f = 1;
    if(up) f += 0.185; else f -= 0.12;
    if(!zp) f += 0.05;  if(!zm) f += 0.015;
    if(!xp) f += 0.085; if(!xm) f -= 0.035;
    f += (hash3(x,y,z)-0.5)*0.045;
    px.push(x,y,z); cl.push(scaleC(c, f));
  }
  const n = px.length/3;
  lattice = new THREE.InstancedMesh(boxGeo, latticeMat, n);
  lattice.castShadow = true; lattice.receiveShadow = true;
  for(let i=0;i<n;i++){
    const sc = 0.972 + hash3(px[i*3], px[i*3+1]+7, px[i*3+2])*0.028;
    _m4.compose(_v.set(px[i*3],px[i*3+1],px[i*3+2]), _q, _s.set(sc,sc,sc));
    lattice.setMatrixAt(i, _m4);
    lattice.setColorAt(i, _col.setHex(cl[i]));
  }
  lattice.instanceMatrix.needsUpdate = true;
  if(lattice.instanceColor) lattice.instanceColor.needsUpdate = true;
  scene.add(lattice);

  const gk = [...GLOW.keys()];
  glowMesh = new THREE.InstancedMesh(boxGeo, glowMat, Math.max(1,gk.length));
  glowMesh.frustumCulled = false;
  gk.forEach((k,i)=>{
    const xyz = decodeKey(k);
    _m4.compose(_v.set(xyz[0],xyz[1],xyz[2]), _q, _s.set(0.94,0.94,0.94));
    glowMesh.setMatrixAt(i, _m4);
    glowMesh.setColorAt(i, _col.setHex(GLOW.get(k)));
  });
  glowMesh.instanceMatrix.needsUpdate = true;
  if(glowMesh.instanceColor) glowMesh.instanceColor.needsUpdate = true;
  scene.add(glowMesh);

  const wl = uniqueWater();
  waterCount = wl.length;
  waterMesh = new THREE.InstancedMesh(boxGeo, waterMat, Math.max(1,waterCount));
  waterMesh.renderOrder = 2;
  wl.forEach((w,i)=>{
    _m4.compose(_v.set(w.x, w.y, w.z), _q, _s.set(1.05,0.98,1.05));
    waterMesh.setMatrixAt(i, _m4);
    waterMesh.setColorAt(i, _col.setHex(w.c));
  });
  waterMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  waterMesh.instanceMatrix.needsUpdate = true;
  if(waterMesh.instanceColor) waterMesh.instanceColor.needsUpdate = true;
  scene.add(waterMesh);

  WATER_Y0 = new Float32Array(waterCount);
  WATER_PHASE = new Float32Array(waterCount);
  WATER_BOB = new Float32Array(waterCount);
  wl.forEach((w,i)=>{
    WATER_Y0[i] = w.y;
    WATER_PHASE[i] = w.x*0.55 + w.z*0.42 + (w.pond ? 9.0 : 0);
    WATER_BOB[i] = (hash3(w.x,5,w.z)-0.5)*0.16;
  });
  return { lattice: n, glow: gk.length, water: waterCount };
}

const kois = [];
function initKoi(){
  const mats = [0xf4772f, 0xf6f1e6, 0x2f2f38, 0xffb03a, 0xf2f2f2]
    .map(c => new THREE.MeshLambertMaterial({ color:c }));
  for(let i=0;i<9;i++){
    const g = new THREE.Group();
    const body = new THREE.Mesh(boxGeo, mats[i % 2 === 0 ? 0 : 1]);
    body.scale.set(1.7,0.62,0.8);
    const mid  = new THREE.Mesh(boxGeo, mats[(i+1) % mats.length]);
    mid.scale.set(1.0,0.55,0.66); mid.position.x = -1.2;
    const tail = new THREE.Mesh(boxGeo, mats[(i+2) % mats.length]);
    tail.scale.set(0.6,0.8,0.16); tail.position.x = -2.0;
    g.add(body, mid, tail);
    g.userData = { tail, a: rnd()*Math.PI*2, r: rr(2.6,8.0),
                   sp: rr(0.16,0.42)*(rnd()<0.5?-1:1), ph: rnd()*9,
                   cx: SITE.pond.x + rr(-4,4), cz: SITE.pond.z + rr(-3,3) };
    scene.add(g); kois.push(g);
  }
}
function updateKoi(t){
  for(const k of kois){
    const d = k.userData;
    const a = d.a + t*d.sp;
    const wob = Math.sin(t*1.4 + d.ph)*0.9;
    k.position.set(d.cx + Math.cos(a)*(d.r + wob),
                   WATER_Y - 0.7 + Math.sin(t*1.1 + d.ph)*0.26,
                   d.cz + Math.sin(a)*(d.r*0.76 + wob*0.6));
    k.rotation.y = -a + (d.sp > 0 ? -Math.PI/2 : Math.PI/2);
    d.tail.rotation.y = Math.sin(t*5.4 + d.ph)*0.5;
  }
}

const PETAL_N = 1500;
let petalMesh; const petals = [];
function initPetals(){
  petalMesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshLambertMaterial({ color:0xffffff }), PETAL_N);
  petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const shades = [PAL.sakuraLite, PAL.sakura, PAL.sakuraSnow, PAL.sakuraDeep, 0xffeaf1];
  for(let i=0;i<PETAL_N;i++){
    const p = {}; resetPetal(p); petals.push(p);
    petalMesh.setColorAt(i, _col.setHex(shades[Math.floor(rnd()*shades.length)]));
  }
  if(petalMesh.instanceColor) petalMesh.instanceColor.needsUpdate = true;
  scene.add(petalMesh);
}
function resetPetal(p){
  if(BLOOM_SOURCE.length === 0){ p.x = rr(-40,40); p.z = rr(-40,40); p.y = rr(18,40); }
  else {
    const b = BLOOM_SOURCE[Math.floor(rnd()*BLOOM_SOURCE.length)];
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*b.r;
    p.x = b.x + Math.cos(a)*d;
    p.z = b.z + Math.sin(a)*d;
    p.y = b.y + rr(-1.5, 3.0);
  }
  p.vy = -rr(0.9, 2.3);
  p.ph = rnd()*Math.PI*2;
  p.spin = rr(1.4,4.4);
  p.sway = rr(0.7,2.2);
  p.sc = rr(0.16,0.3);
  p.t = rnd()*10;
}
function updatePetals(dt, wind){
  for(let i=0;i<PETAL_N;i++){
    const p = petals[i];
    p.t += dt;
    p.y += p.vy*dt*(0.75 + wind*0.6);
    p.x += (Math.sin(p.t*1.7 + p.ph)*p.sway + wind*3.6)*dt;
    p.z += (Math.cos(p.t*1.3 + p.ph*1.7)*p.sway*0.8 + wind*1.6)*dt;
    if(p.y < WATER_Y - 0.4 || Math.abs(p.x) > 150 || Math.abs(p.z) > 150) resetPetal(p);
    const rot = p.t*p.spin;
    _e.set(rot*0.9, rot, rot*0.5);
    _q.setFromEuler(_e);
    _m4.compose(_v.set(p.x,p.y,p.z), _q, _s.set(p.sc, p.sc*0.34, p.sc*1.5));
    petalMesh.setMatrixAt(i, _m4);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

function dirFrom(az, el){
  const a = az*Math.PI/180, e = el*Math.PI/180;
  return new THREE.Vector3(Math.cos(e)*Math.sin(a), Math.sin(e), Math.cos(e)*Math.cos(a));
}
function state(o){
  return {
    dir: dirFrom(o.az, o.el), sunColor: new THREE.Color(o.sun), sunI: o.sunI,
    hemiSky: new THREE.Color(o.hemiSky), hemiGround: new THREE.Color(o.hemiGround), hemiI: o.hemiI,
    skyTop: new THREE.Color(o.top), skyBot: new THREE.Color(o.bot), sunGlow: o.sunGlow,
    fogColor: new THREE.Color(o.fog), fogD: o.fogD, exposure: o.exposure,
    glow: o.glow, starOp: o.stars, bloomS: o.bloomS, sunOp: o.sunDisc, moonOp: o.moonDisc,
    lampI: o.lamp, fillI: o.fill, fillCol: new THREE.Color(o.fillCol), waterOp: o.waterOp
  };
}
const TIME_DEFS = {
  dawn:   { az:118, el:6,  sun:0xffb287, sunI:2.2, hemiSky:0xa8b6de, hemiGround:0x4b4436, hemiI:0.6,

            glow:0.5, stars:0.0, bloomS:0.46, sunDisc:1, moonDisc:0, lamp:8,  fill:0.3, fillCol:0xffd9c0, waterOp:0.74 },
  day:    { az:150, el:58, sun:0xfff4e2, sunI:2.8, hemiSky:0xc6ddff, hemiGround:0x6f7c58, hemiI:0.9,
            top:0x3f76c8, bot:0xcde0f0, sunGlow:0.75, fog:0xc9dbeb, fogD:0.0022, exposure:1.0,
            glow:0.12, stars:0.0, bloomS:0.26, sunDisc:1, moonDisc:0, lamp:1.5,fill:0.35,fillCol:0xdfe9ff, waterOp:0.68 },
  golden: { az:62,  el:12, sun:0xffa64d, sunI:3.0, hemiSky:0xf6cbaa, hemiGround:0x5c5138, hemiI:0.52,
            top:0x3a5390, bot:0xffb173, sunGlow:1.35, fog:0xe4ac8b, fogD:0.0034, exposure:1.03,
            glow:0.6, stars:0.0, bloomS:0.6,  sunDisc:1, moonDisc:0, lamp:14, fill:0.32,fillCol:0xffcf9c, waterOp:0.76 },
  night:  { az:-118,el:38, sun:0x8fa9ff, sunI:0.55,hemiSky:0x334070, hemiGround:0x151a28, hemiI:0.34,
            top:0x080d24, bot:0x1e2c4e, sunGlow:0.5, fog:0x141c31, fogD:0.0042, exposure:1.2,
            glow:1.55,stars:1.0, bloomS:1.0,  sunDisc:0, moonDisc:1, lamp:26, fill:0.12,fillCol:0x7f96d8, waterOp:0.8 }
};
let cur = state(TIME_DEFS.golden), tgt = state(TIME_DEFS.golden);
let timeName = 'golden';
function setTime(name){
  if(!TIME_DEFS[name]) return;
  timeName = name;
  tgt = state(TIME_DEFS[name]);
  document.querySelectorAll('[data-time]').forEach(b => b.classList.toggle('on', b.dataset.time === name));
}
function easeState(dt){
  const k = 1 - Math.exp(-dt*2.1);
  for(const p in cur){
    const a = cur[p], b = tgt[p];
    if(a && a.isColor) a.lerp(b, k);
    else if(a && a.isVector3) a.lerp(b, k);
    else cur[p] = a + (b - a)*k;
  }
  applyState();
}
function applyState(){
  const d = cur.dir.clone().normalize();
  sun.color.copy(cur.sunColor); sun.intensity = cur.sunI;
  sun.position.copy(d).multiplyScalar(160);
  sun.target.position.set(0, 24, 0);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity = cur.hemiI;
  skyUniforms.topColor.value.copy(cur.skyTop);
  skyUniforms.botColor.value.copy(cur.skyBot);
  skyUniforms.sunColor.value.copy(cur.sunColor);
  skyUniforms.sunDir.value.copy(d);
  skyUniforms.glowMix.value = cur.sunGlow;
  scene.fog.color.copy(cur.fogColor); scene.fog.density = cur.fogD;
  renderer.toneMappingExposure = cur.exposure;
  bloom.strength = cur.bloomS;
  if(glowMat) glowMat.color.setScalar(cur.glow);
  starMat.uniforms.uOpacity.value = cur.starOp;
  sunDisc.material.opacity = cur.sunOp;
  moonDisc.material.opacity = cur.moonOp;
  sunDisc.position.copy(d).multiplyScalar(430);
  moonDisc.position.copy(d).multiplyScalar(430);
  for(const l of lampLights) l.intensity = cur.lampI;
  fillLight.intensity = cur.fillI; fillLight.color.copy(cur.fillCol);
  if(waterMat) waterMat.opacity = cur.waterOp;
}

/* ═══════════════════════  CAMERA VIEWS  ══════════════════════════════ */
const VIEWS = [
  { pos:[ 90, 60, 104], tgt:[  0, 28,   0] },   // overview
  { pos:[ 44, 40,  56], tgt:[  0, 38,  -8] },   // pagoda
  { pos:[  6, 13,  34], tgt:[ 26,  8,  14] },   // pond
  { pos:[-26, 17,  45], tgt:[-13, 13,  31] },   // blossoms
  { pos:[-49, 21,  33], tgt:[-29, 11,  13] },   // zen garden
  { pos:[ -3, 13,  21], tgt:[  0, 15,  37] },   // torii
  { pos:[ -2, 15,  -9], tgt:[-18, 10, -25] }    // tea house
];
let flyT = 1, flyDur = 1.0;
const flyFromP = new THREE.Vector3(), flyToP = new THREE.Vector3();
const flyFromT = new THREE.Vector3(), flyToT = new THREE.Vector3();
let viewIndex = 0, tourOn = false, tourClock = 0, orbitWanted = true;

function flyTo(i, dur){
  viewIndex = ((i % VIEWS.length) + VIEWS.length) % VIEWS.length;
  const v = VIEWS[viewIndex];
  flyFromP.copy(camera.position); flyToP.set(v.pos[0], v.pos[1], v.pos[2]);
  flyFromT.copy(controls.target); flyToT.set(v.tgt[0], v.tgt[1], v.tgt[2]);
  flyT = 0; flyDur = dur || 2.0;
  controls.autoRotate = false;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', +b.dataset.view === viewIndex));
  chime(329.63 * (1 + viewIndex*0.06), 0.16);
}
function updateFly(dt){
  if(flyT >= 1) return;
  flyT = Math.min(1, flyT + dt/flyDur);
  const e = flyT < 0.5 ? 4*flyT*flyT*flyT : 1 - Math.pow(-2*flyT+2, 3)/2;
  camera.position.lerpVectors(flyFromP, flyToP, e);
  controls.target.lerpVectors(flyFromT, flyToT, e);
  if(flyT >= 1 && orbitWanted) controls.autoRotate = true;
}

/* ═══════════════════════  SOUND  ═════════════════════════════════════ */
let actx = null, master = null, soundOn = false, nextNote = 0;
const SCALE = [220, 246.94, 293.66, 329.63, 392.0, 440, 587.33, 659.25];
function initAudio(){
  if(actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.0; master.connect(actx.destination);
    const dg = actx.createGain(); dg.gain.value = 0.34;
    const dl = actx.createDelay(1.2); dl.delayTime.value = 0.42;
    const fb = actx.createGain(); fb.gain.value = 0.42;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
    dl.connect(fb); fb.connect(dl); dl.connect(dg); dg.connect(master);
    master._send = dl;
    master.gain.linearRampToValueAtTime(0.5, actx.currentTime + 2.2);
  } catch(e){ soundOn = false; }
}
function pluck(freq, vol){
  if(!actx || !soundOn) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.value = 2400;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime((vol||0.22), t0 + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  o.connect(f); f.connect(g); g.connect(master); g.connect(master._send);
  o.start(t0); o.stop(t0 + 2.6);
  const o2 = actx.createOscillator(), g2 = actx.createGain();
  o2.type = 'sine'; o2.frequency.value = freq*2.005;
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime((vol||0.22)*0.3, t0 + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
  o2.connect(g2); g2.connect(master);
  o2.start(t0); o2.stop(t0 + 1.2);
}
function chime(freq, vol){ if(soundOn) pluck(freq || pick(SCALE), vol); }
let lastTimeName = '';

const dock = document.getElementById('dock');
dock.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.view !== undefined) { tourOn = false; flyTo(+b.dataset.view); }
  else if(b.dataset.time !== undefined) setTime(b.dataset.time);
  else if(b.dataset.toggle === 'orbit'){
    orbitWanted = !orbitWanted; controls.autoRotate = orbitWanted;
    b.classList.toggle('on', orbitWanted);
  } else if(b.dataset.toggle === 'bloom'){
    bloom.enabled = !bloom.enabled; b.classList.toggle('on', bloom.enabled);
  } else if(b.dataset.toggle === 'petals'){
    petalsOn = !petalsOn; if(petalMesh) petalMesh.visible = petalsOn;
    b.classList.toggle('on', petalsOn);
  } else if(b.dataset.toggle === 'sound'){
    soundOn = !soundOn; initAudio();
    if(actx && actx.state === 'suspended') actx.resume();
    if(master) master.gain.linearRampToValueAtTime(soundOn ? 0.5 : 0.0, actx.currentTime + 0.8);
    b.classList.toggle('on', soundOn);
    if(soundOn) pluck(pick(SCALE), 0.24);
  }
});
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if(k >= '1' && k <= '7'){ tourOn = false; flyTo(+k - 1); }
  else if(k === 't'){
    const keys = Object.keys(TIME_DEFS);
    setTime(keys[(keys.indexOf(timeName)+1) % keys.length]);
  }
  else if(k === 'c'){ tourOn = !tourOn; tourClock = 99; }
  else if(k === 'r'){ tourOn = false; flyTo(0, 2.6); }
  else if(k === 'o'){ dock.querySelector('[data-toggle="orbit"]').click(); }
  else if(k === 'b'){ dock.querySelector('[data-toggle="bloom"]').click(); }
  else if(k === 'p'){ dock.querySelector('[data-toggle="petals"]').click(); }
});
addEventListener('pointerdown', () => { if(soundOn) pluck(pick(SCALE), 0.16); });

const loaderEl = document.getElementById('loader');

const nextFrame = () => new Promise(r => requestAnimationFrame(r));

async function boot(){
  for(let i=0;i<BUILD.length;i++){
    stageEl.textContent = BUILD[i].name;
    barEl.style.width = (i / BUILD.length * 92).toFixed(1) + '%';
    await nextFrame();
    const t0 = performance.now();
    BUILD[i].fn();
    if(performance.now() - t0 > 900) await nextFrame();
  }
  stageEl.textContent = 'assembling the lattice';
  barEl.style.width = '95%';
  await nextFrame();
  const counts = assemble();
  initWaterGuard();
  initFall(); initKoi(); initPetals(); initFlies(); initSkyLanterns(); initBirds(); initLampLights();
  applyState();
  stageEl.textContent = 'opening the gate';
  barEl.style.width = '100%';
  await nextFrame();
  renderer.render(scene, camera);
  await new Promise(r => setTimeout(r, 260));
  loaderEl.classList.add('done');

  document.getElementById('hint').classList.add('in');
  dock.classList.add('in');
  document.getElementById('fps').classList.add('in');
  document.getElementById('credit').classList.add('in');
  document.getElementById('voxCount').textContent =
    (counts.lattice + counts.glow).toLocaleString('en-US');
  flyTo(0, 3.4);
  clock.start();
  renderer.setAnimationLoop(frame);
}

let elapsed = 0;

function frame(){
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;
  easeState(dt);
  updateFly(dt);
  updateWaterAnim(elapsed);
  updateFall(dt, elapsed);
  updateKoi(elapsed);
  if(petalsOn) updatePetals(dt, 0.34 + 0.3*Math.sin(elapsed*0.19) + 0.12*Math.sin(elapsed*0.63));
  updateFlies(elapsed, Math.max(0, cur.starOp * 1.15 - 0.05));
  updateSkyLanterns(dt, elapsed, cur.glow);
  updateBirds(elapsed);
  starMat.uniforms.uTime.value = elapsed;
  sunDisc.lookAt(camera.position);
  moonDisc.lookAt(camera.position);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);

  if(tourOn){
    tourClock += dt;
    if(tourClock > 9){ tourClock = 0; flyTo(viewIndex + 1, 3.2); }
  }
  if(soundOn && elapsed > nextNote){
    nextNote = elapsed + rr(1.6, 4.4);
    pluck(pick(SCALE) * (rnd() < 0.25 ? 2 : 1), rr(0.1, 0.24));
    if(rnd() < 0.3) setTimeout(()=>pluck(pick(SCALE), 0.12), 260);
  }
  controls.update();
  composer.render();

  fpsAcc += dt; fpsFrames++;
  if(fpsAcc > 0.6){
    fpsEl.textContent = Math.round(fpsFrames/fpsAcc) + ' fps · ' +
      (lattice ? lattice.count.toLocaleString('en-US') : 0) + ' cubes';
    fpsAcc = 0; fpsFrames = 0;
  }
}
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
boot();

</script>
</body>
</html>

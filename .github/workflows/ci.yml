name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (tools + engine emit dist that typechecking resolves)
        run: npm run build -w packages/tools -w packages/engine

      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/tools/tsconfig.json
          npx tsc --noEmit -p packages/engine/tsconfig.json
          npx tsc --noEmit -p apps/cli/tsconfig.json

      - name: Test
        run: npm test
